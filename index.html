<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios de Imagens</title>
</head>
<body>

  <h1>Galeria de Imagens</h1>

  <!-- 1. Galeria com 3 imagens, cada uma com alt bem descritivo -->
  <section class="galeria">
    <img src="https://picsum.photos" alt="Vale amplo entre montanhas rochosas sob um céu nublado ao amanhecer">
    <img src="https://picsum.photos" alt="Barista preparando café coado em uma cafeteria com iluminação aconchegante">
    <img src="https://picsum.photos" alt="Pilha de livros antigos abertos sobre uma mesa de madeira em uma biblioteca">
  </section>

  <!-- 2. Imagem com legenda usando <figure> -->
  <figure>
    <img src="https://picsum.photos" alt="Rio de águas calmas correndo entre encostas verdes e montanhas">
    <figcaption>Paisagem natural de um rio cercado por montanhas.</figcaption>
  </figure>

  <!-- 3. Imagem transformada em link (<img> dentro de <a>) -->
  <a href="https://mozilla.org" target="_blank" rel="noopener noreferrer">
    <img src="https://picsum.photos" alt="Pessoa digitando código em um notebook sobre uma mesa de trabalho">
  </a>

</body>
</html>
